name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            package: build:mac
            installers: release/*/*.dmg
          - name: Windows
            os: windows-latest
            package: build:win
            installers: release/*/*.exe
    runs-on: ${{ matrix.os }}
    env:
      # Unsigned builds until signing is set up in M10.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e -- --trace off

      - run: npm run ${{ matrix.package }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: ${{ matrix.installers }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ runner.os }}
          path: playwright-report
          if-no-files-found: ignore
