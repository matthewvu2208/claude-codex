# App name, icon, signing and notarization are settled in M10.
appId: dev.claudecodex.app
productName: Claude Codex
copyright: Copyright © 2026
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - '!out/main/fake-codex.js' # test-only scripted app-server
  - package.json
asar: true
# Native modules ship N-API prebuilds (ABI-stable across Node and Electron), so no rebuild.
npmRebuild: false
# The Claude Code binary must be a real file to run.
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
  # node-pty loads its native module and runs spawn-helper (macOS) from disk.
  - node_modules/node-pty/**
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # Each dmg carries only the Claude Code binary for its own CPU.
  files:
    - '!node_modules/@anthropic-ai/claude-agent-sdk-darwin-*/**'
    - node_modules/@anthropic-ai/claude-agent-sdk-darwin-${arch}/**
  hardenedRuntime: true
  notarize: false
dmg:
  writeUpdateInfo: false
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
  files:
    - '!node_modules/@anthropic-ai/claude-agent-sdk-win32-arm64/**'
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  differentialPackage: false
publish: null
